apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-devops-agent-
  labels:
    app: autonomous-devops-agent-
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autonomous-devops-agent-
  template:
    metadata:
      labels:
        app: autonomous-devops-agent-
    spec:
      containers:
        - name: autonomous-devops-agent-
          image: ${{ secrets.DOCKER_USERNAME }}/autonomous-devops-agent-:latest
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10