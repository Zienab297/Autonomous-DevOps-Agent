# .github/workflows/ci.yml — intentionally broken
#
# BUGS planted (for SelfHealingAgent to find and fix):
#   1. Line 18 — actions/checkout@v1      → deprecated, should be @v4
#   2. Line 20 — actions/setup-python@v1  → deprecated, should be @v5
#   3. Line 22 — actions/cache@v1         → deprecated, should be @v4
#   4. Line 45 — actions/upload-artifact@v2 → deprecated, should be @v4

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4          

      - name: Set up Python
        uses: actions/setup-python@v5      
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4             
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4   
        with:
          name: test-results
          path: test-results/
